<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Palindrome Checker</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:#f2f2f2;
}

.container{
    width:420px;
    margin:50px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
}

button{
    width:100%;
    padding:10px;
    background:#2196F3;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#1565c0;
}

#result,#count{
    margin-top:15px;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h2>Palindrome Checker</h2>

<input type="text" id="text" placeholder="Enter a word or sentence">

<button onclick="checkPalindrome()">
Check
</button>

<p id="result"></p>
<p id="count"></p>

</div>

<script>

/*=========================
GLOBAL SCOPE
==========================*/

let appName = "Palindrome Checker";
const version = "1.0";

console.log(appName, version);

/*=========================
IIFE FUNCTION
Runs automatically
==========================*/

(function(){
    console.log("Application Started");
})();

/*=========================
FUNCTION DECLARATION
==========================*/

function cleanText(str){
    return str.toLowerCase().replace(/[^a-z0-9]/g,"");
}

/*=========================
FUNCTION EXPRESSION
==========================*/

const reverseText = function(str){
    return str.split("").reverse().join("");
};

/*=========================
ARROW FUNCTION
==========================*/

const isPalindrome = text =>
    cleanText(text) === reverseText(cleanText(text));

/*=========================
ANONYMOUS FUNCTION
Stored in a variable
==========================*/

const welcome = function(){
    console.log("Welcome User");
};

welcome();

/*=========================
CALLBACK FUNCTION
==========================*/

function displayMessage(message, callback){
    document.getElementById("result").innerHTML = message;

    callback();
}

/*=========================
CLOSURE
==========================*/

function createCounter(){

    let count = 0;

    return function(){

        count++;

        return count;

    }

}

const counter = createCounter();

/*=========================
LEXICAL SCOPE
==========================*/

function outerFunction(){

    let outerMessage = "Lexical Scope Example";

    function innerFunction(){

        console.log(outerMessage);

    }

    innerFunction();

}

outerFunction();

/*=========================
MAIN FUNCTION
==========================*/

function checkPalindrome(){

    try{

        let input = document.getElementById("text").value;

        // Function Scope
        let resultText = "";

        if(input.trim()=="")
            throw "Please enter some text.";

        if(isPalindrome(input))
            resultText = "<span style='color:green;'>It is a Palindrome ✔</span>";
        else
            resultText = "<span style='color:red;'>It is not a Palindrome ✖</span>";

        // Callback Function
        displayMessage(resultText,function(){

            let total = counter();

            document.getElementById("count").innerHTML =
            "Total Checks: " + total;

        });

        // Block Scope
        if(true){

            let blockVariable = "Visible only inside this block";
            console.log(blockVariable);

            const blockConstant = "Block Constant";
            console.log(blockConstant);

        }

    }

    catch(error){

        document.getElementById("result").innerHTML =
        "<span style='color:red;'>" + error + "</span>";

    }

    finally{

        console.log("Palindrome check completed.");

    }

}

</script>

</body>
</html>
