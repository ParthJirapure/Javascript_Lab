<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Theme Settings</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            background-color: #f2f2f2;
            color: #222;

            transition: 0.3s;
        }

        /* Student Details Box */
        .student-info {
            position: absolute;
            top: 20px;
            right: 20px;

            padding: 15px 20px;

            background-color: white;
            color: #222;

            border: 1px solid #222;
            border-radius: 5px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);

            text-align: left;
            font-size: 14px;
        }

        .student-info p {
            margin: 6px 0;
        }

        /* Main Theme Settings Box */
        .container {
            width: 600px;
            padding: 40px;

            text-align: center;

            background-color: white;
            border: 1px solid #222;
            border-radius: 3px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

            transition: 0.3s;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 30px;
        }

        .description {
            font-size: 16px;
            margin-bottom: 20px;
        }

        select {
            padding: 8px 12px;
            font-size: 15px;
            cursor: pointer;

            border: 1px solid #aaa;
            border-radius: 4px;
            background-color: white;
        }

        /* Buttons */
        .buttons {
            margin-top: 25px;

            display: flex;
            justify-content: center;
            gap: 15px;

            flex-wrap: wrap;
        }

        button {
            padding: 10px 15px;

            border: 1px solid #aaa;
            border-radius: 4px;

            background-color: #e9e9e9;
            color: #222;

            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background-color: #d5d5d5;
        }

        .clear-button {
            margin-top: 20px;
        }

        #message {
            min-height: 22px;
            margin-top: 25px;

            font-size: 15px;
            font-weight: bold;
        }

        /* =========================
           DARK THEME
           ========================= */

        body.dark {
            background-color: #191919;
            color: white;
        }

        body.dark .container {
            background-color: #292929;
            border-color: #555;
        }

        body.dark .student-info {
            background-color: #292929;
            color: white;
            border-color: #555;
        }

        body.dark select,
        body.dark button {
            background-color: #eeeeee;
            color: #111;
        }
    </style>
</head>

<body>

    <!-- =========================
         STUDENT DETAILS
         Outside the main form
         ========================= -->

    <div class="student-info">

        <p>
            <strong>Name:</strong>
            Parth Jirapure
        </p>

        <p>
            <strong>Year:</strong>
            3
        </p>

        <p>
            <strong>Sem:</strong>
            5
        </p>

        <p>
            <strong>PRN:</strong>
            24070521243
        </p>

    </div>


    <!-- =========================
         THEME SETTINGS
         ========================= -->

    <div class="container">

        <h1>Theme Settings</h1>

        <p class="description">
            Select your preferred theme:
        </p>


        <!-- Theme Selection -->

        <select id="themeSelect">

            <option value="light">
                Light
            </option>

            <option value="dark">
                Dark
            </option>

        </select>


        <!-- Storage Buttons -->

        <div class="buttons">

            <button onclick="saveLocalStorage()">
                Save using localStorage
            </button>

            <button onclick="saveSessionStorage()">
                Save using sessionStorage
            </button>

        </div>


        <!-- Clear Preferences -->

        <button
            class="clear-button"
            onclick="clearPreferences()">

            Clear Preferences

        </button>


        <!-- Status Message -->

        <p id="message"></p>

    </div>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>

        // Get HTML elements
        const themeSelect =
            document.getElementById("themeSelect");

        const message =
            document.getElementById("message");


        // --------------------------------
        // Apply selected theme
        // --------------------------------

        function applyTheme(theme) {

            if (theme === "dark") {

                document.body.classList.add("dark");

            } else {

                document.body.classList.remove("dark");

            }

            themeSelect.value = theme;
        }


        // --------------------------------
        // Save using localStorage
        // --------------------------------

        function saveLocalStorage() {

            const theme =
                themeSelect.value;

            // Store theme permanently
            localStorage.setItem(
                "theme",
                theme
            );

            // Remove session storage
            sessionStorage.removeItem("theme");

            // Apply theme
            applyTheme(theme);

            // Display message
            message.textContent =
                "Theme saved using localStorage.";
        }


        // --------------------------------
        // Save using sessionStorage
        // --------------------------------

        function saveSessionStorage() {

            const theme =
                themeSelect.value;

            // Store theme for current session
            sessionStorage.setItem(
                "theme",
                theme
            );

            // Remove local storage
            localStorage.removeItem("theme");

            // Apply theme
            applyTheme(theme);

            // Display message
            message.textContent =
                "Theme saved using sessionStorage.";
        }


        // --------------------------------
        // Clear Preferences
        // --------------------------------

        function clearPreferences() {

            // Remove localStorage
            localStorage.removeItem("theme");

            // Remove sessionStorage
            sessionStorage.removeItem("theme");

            // Reset to light theme
            applyTheme("light");

            // Display message
            message.textContent =
                "Preferences cleared.";
        }


        // --------------------------------
        // Load saved theme
        // --------------------------------

        function loadTheme() {

            // Check localStorage
            const localTheme =
                localStorage.getItem("theme");

            // Check sessionStorage
            const sessionTheme =
                sessionStorage.getItem("theme");


            if (localTheme) {

                // Load localStorage theme
                applyTheme(localTheme);

                message.textContent =
                    "Theme loaded from localStorage.";

            }

            else if (sessionTheme) {

                // Load sessionStorage theme
                applyTheme(sessionTheme);

                message.textContent =
                    "Theme loaded from sessionStorage.";

            }

            else {

                // Default theme
                applyTheme("light");

            }
        }


        // --------------------------------
        // Change theme immediately
        // --------------------------------

        themeSelect.addEventListener(
            "change",
            function () {

                const theme =
                    themeSelect.value;

                applyTheme(theme);

                message.textContent =
                    "Theme changed. Select a storage option to save it.";

            }
        );


        // --------------------------------
        // Load theme when page starts
        // --------------------------------

        loadTheme();

    </script>

</body>
</html>
