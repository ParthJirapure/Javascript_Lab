<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JSON Data Loading</title>

    <!-- jQuery Library -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


    <style>

        /* ==============================
           BODY
           ============================== */

        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            text-align: center;
            margin: 0;
            padding-top: 40px;
        }


        /* ==============================
           STUDENT DETAILS
           TOP RIGHT
           ============================== */

        .student-details {

            position: absolute;

            top: 10px;
            right: 15px;

            background-color: white;
            color: black;

            border: 3px solid black;

            padding: 10px 15px;

            text-align: left;

            font-size: 14px;
        }


        .student-details h3 {

            margin: 0 0 8px 0;

            color: black;

            text-align: center;
        }


        .student-details p {

            margin: 4px 0;

            color: black;
        }


        /* ==============================
           MAIN HEADING
           ============================== */

        h1 {
            color: black;
        }


        /* ==============================
           BUTTONS
           ============================== */

        button {

            padding: 10px 20px;

            margin: 10px;

            background-color: white;

            color: black;

            border: 2px solid black;

            cursor: pointer;
        }


        button:hover {

            background-color: black;

            color: white;
        }


        /* ==============================
           TABLE
           ============================== */

        table {

            width: 70%;

            margin: 20px auto;

            border-collapse: collapse;

            background-color: white;

            color: black;
        }


        th,
        td {

            border: 2px solid black;

            padding: 10px;
        }


        th {

            background-color: black;

            color: white;
        }


        td {

            background-color: white;

            color: black;
        }

    </style>

</head>


<body>


    <!-- ==================================
         STUDENT DETAILS
         ================================== -->

    <div class="student-details">

        <h3>Student Details</h3>

        <p>
            <b>Name:</b> Parth Jirapure
        </p>

        <p>
            <b>Year:</b> 3
        </p>

        <p>
            <b>Sem:</b> 5
        </p>

        <p>
            <b>PRN:</b> 24070521243
        </p>

    </div>



    <!-- ==================================
         MAIN CONTENT
         ================================== -->

    <h1>Student Details</h1>


    <!-- ==================================
         BUTTONS
         ================================== -->

    <button onclick="loadFetch()">
        Load using fetch()
    </button>


    <button onclick="loadJQuery()">
        Load using $.getJSON()
    </button>



    <!-- ==================================
         TABLE
         ================================== -->

    <table>

        <thead>

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Email</th>

            </tr>

        </thead>


        <tbody id="studentTable">

            <!-- JSON data will be displayed here -->

        </tbody>

    </table>



    <!-- ==================================
         JAVASCRIPT
         ================================== -->

    <script>


        // ==================================
        // JSON DATA
        // ==================================

        const students = [

            {
                "id": 1,
                "name": "Ram",
                "email": "ram23@gmail.com"
            },

            {
                "id": 2,
                "name": "Priya",
                "email": "priya31@gmail.com"
            },

            {
                "id": 3,
                "name": "Amit",
                "email": "amit12@gmail.com"
            },

            {
                "id": 4,
                "name": "Karan",
                "email": "karan06@gmail.com"
            }

        ];



        // ==================================
        // CONVERT JSON INTO BLOB
        // ==================================

        const jsonBlob = new Blob(

            [
                JSON.stringify(students)
            ],

            {
                type: "application/json"
            }

        );



        // ==================================
        // CREATE JSON URL
        // ==================================

        const jsonURL =
            URL.createObjectURL(jsonBlob);



        // ==================================
        // USING fetch()
        // ==================================

        function loadFetch() {


            fetch(jsonURL)


                .then(function(response) {


                    // Convert response into JSON

                    return response.json();


                })


                .then(function(data) {


                    // Get table body

                    let table =
                        document.getElementById(
                            "studentTable"
                        );


                    // Clear old data

                    table.innerHTML = "";


                    // Loop through JSON data

                    data.forEach(
                        function(student) {


                            // Create table row

                            let row = `

                                <tr>

                                    <td>
                                        ${student.id}
                                    </td>

                                    <td>
                                        ${student.name}
                                    </td>

                                    <td>
                                        ${student.email}
                                    </td>

                                </tr>

                            `;


                            // Add row to table

                            table.innerHTML += row;

                        }
                    );

                })


                .catch(function(error) {


                    console.log(
                        "Error loading JSON:",
                        error
                    );

                });

        }



        // ==================================
        // USING jQuery $.getJSON()
        // ==================================

        function loadJQuery() {


            $.getJSON(

                jsonURL,

                function(data) {


                    // Clear old data

                    $("#studentTable").html("");


                    // Loop through JSON data

                    $.each(

                        data,

                        function(index, student) {


                            // Create table row

                            let row = `

                                <tr>

                                    <td>
                                        ${student.id}
                                    </td>

                                    <td>
                                        ${student.name}
                                    </td>

                                    <td>
                                        ${student.email}
                                    </td>

                                </tr>

                            `;


                            // Add row to table

                            $("#studentTable").append(row);

                        }

                    );

                }

            )


            // Error handling

            .fail(function() {


                console.log(
                    "Error loading JSON"
                );

            });

        }


    </script>

</body>

</html>
