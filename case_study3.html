<!DOCTYPE html>
<html>
<head>
    <title>Scholarship Eligibility System</title>
</head>

<body>

<!-- Student Details -->
<div style="position:absolute; top:10px; right:20px; text-align:right; font-family:Arial;">
    <b>Name:</b> Parth Jirapure<br>
    <b>PRN:</b> 24070521243<br>
    <b>Semester:</b> 5<br>
    <b>Section:</b> D
</div>

<h2>Scholarship Eligibility System</h2>

<script>

// Student Name
let studentName = prompt("Enter Student Name:");

// PRN Validation
let prn = prompt("Enter 11 Digit PRN:");

while (!/^\d{11}$/.test(prn)) {
    alert("Invalid PRN! Enter exactly 11 digits.");
    prn = prompt("Enter 11 Digit PRN:");
}

// Marks Validation
let marks = prompt("Enter Student Marks (0-100):");

while (!/^\d+$/.test(marks)) {
    alert("Marks should contain numbers only.");
    marks = prompt("Re-enter Student Marks:");
}

marks = Number(marks);

while (marks < 0 || marks > 100) {
    alert("Marks should be between 0 and 100.");
    marks = Number(prompt("Re-enter Student Marks:"));
}

// Scholarship Calculation
let scholarship;

if (marks < 50)
    scholarship = "Not Eligible";
else if (marks >= 50 && marks <= 69)
    scholarship = "Bronze Scholarship";
else if (marks >= 70 && marks <= 84)
    scholarship = "Silver Scholarship";
else if (marks >= 85 && marks <= 94)
    scholarship = "Gold Scholarship";
else
    scholarship = "Platinum Scholarship";

// Output
document.write("<h2>Scholarship Result</h2>");
document.write("<p><b>Student Name:</b> " + studentName + "</p>");
document.write("<p><b>PRN:</b> " + prn + "</p>");
document.write("<p><b>Marks:</b> " + marks + "</p>");
document.write("<hr>");
document.write("<h3>Scholarship Category: " + scholarship + "</h3>");

</script>

</body>
</html>
