<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Handling with JavaScript</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: linear-gradient(135deg, #e0f2fe, #ede9fe);
      color: #1e293b;
    }

    .form-container {
      border: none;
      width: 450px;
      padding: 25px;
      box-sizing: border-box;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(30, 64, 175, 0.15);
    }

    .mandatory-note {
      color: #dc2626;
      font-size: 13px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .form-row {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .form-row label {
      width: 110px;
      font-size: 14px;
      color: #334155;
      font-weight: 600;
    }

    .form-row input[type="text"],
    .form-row input[type="email"],
    .form-row input[type="url"],
    .form-row input[type="password"],
    .form-row select {
      padding: 7px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      background-color: #f8fafc;
      color: #1e293b;
      box-sizing: border-box;
    }

    .input-field {
      width: 180px;
    }

    .asterisk {
      color: #ef4444;
      margin-left: 4px;
      font-weight: bold;
    }

    .date-selects select {
      margin-right: 2px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      margin-top: 18px;
      margin-bottom: 18px;
    }

    .checkbox-row input {
      accent-color: #4f46e5;
      cursor: pointer;
    }

    .checkbox-row label {
      margin-left: 5px;
      font-size: 14px;
      color: #475569;
    }

    .submit-btn {
      padding: 8px 20px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, #4f46e5, #2563eb);
      color: white;
      transition: 0.3s;
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #4338ca, #1d4ed8);
      transform: translateY(-1px);
    }

    /* Input highlighting on focus */
    input:focus,
    select:focus {
      background-color: #eff6ff;
      outline: 2px solid #6366f1;
      border-color: #6366f1;
    }

    /* Responsive design */
    @media (max-width: 500px) {
      body {
        margin: 15px;
      }

      .form-container {
        width: 100%;
      }

      .form-row label {
        width: 100px;
      }

      .input-field {
        width: 160px;
      }
    }
  </style>
</head>

<body>

  <div class="form-container">

    <div class="mandatory-note">*Mandatory to fill</div>

    <form id="signupForm" novalidate>

      <!-- Firstname -->
      <div class="form-row">
        <label for="firstname">Firstname:</label>
        <input
          type="text"
          id="firstname"
          class="input-field"
        >
        <span class="asterisk">*</span>
      </div>

      <!-- Lastname -->
      <div class="form-row">
        <label for="lastname">Lastname:</label>
        <input
          type="text"
          id="lastname"
          class="input-field"
        >
      </div>

      <!-- Birthday -->
      <div class="form-row">
        <label>Birthday:</label>

        <div class="date-selects">

          <select id="day">
            <option value="">Day</option>
          </select>

          <select id="month">
            <option value="">Month</option>
            <option value="1">Jan</option>
            <option value="2">Feb</option>
            <option value="3">Mar</option>
            <option value="4">Apr</option>
            <option value="5">May</option>
            <option value="6">Jun</option>
            <option value="7">Jul</option>
            <option value="8">Aug</option>
            <option value="9">Sep</option>
            <option value="10">Oct</option>
            <option value="11">Nov</option>
            <option value="12">Dec</option>
          </select>

          <select id="year">
            <option value="">Year</option>
          </select>

        </div>

        <span class="asterisk">*</span>
      </div>

      <!-- Username -->
      <div class="form-row">
        <label for="username">Username:</label>
        <input
          type="text"
          id="username"
          class="input-field"
        >
        <span class="asterisk">*</span>
      </div>

      <!-- Email -->
      <div class="form-row">
        <label for="email">E-mail:</label>
        <input
          type="email"
          id="email"
          class="input-field"
        >
        <span class="asterisk">*</span>
      </div>

      <!-- Website -->
      <div class="form-row">
        <label for="website">Website:</label>
        <input
          type="url"
          id="website"
          class="input-field"
        >
        <span class="asterisk">*</span>
      </div>

      <!-- Password -->
      <div class="form-row">
        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          class="input-field"
        >
        <span class="asterisk">*</span>
      </div>

      <!-- Re-password -->
      <div class="form-row">
        <label for="repassword">Re-password:</label>
        <input
          type="password"
          id="repassword"
          class="input-field"
        >
        <span class="asterisk">*</span>
      </div>

      <!-- Terms -->
      <div class="checkbox-row">
        <input type="checkbox" id="terms">

        <label for="terms">
          I agree to the terms & conditions.
        </label>
      </div>

      <!-- Submit -->
      <button type="submit" class="submit-btn">
        Sign up
      </button>

    </form>
  </div>


  <script>

    // ==========================================
    // Populate Days (1 to 31)
    // ==========================================

    const daySelect = document.getElementById("day");

    for (let i = 1; i <= 31; i++) {

      const opt = document.createElement("option");

      opt.value = i;
      opt.textContent = i;

      daySelect.appendChild(opt);
    }


    // ==========================================
    // Populate Years (1950 to 2026)
    // ==========================================

    const yearSelect = document.getElementById("year");

    for (let i = 2026; i >= 1950; i--) {

      const opt = document.createElement("option");

      opt.value = i;
      opt.textContent = i;

      yearSelect.appendChild(opt);
    }


    // ==========================================
    // Month Change Event
    // ==========================================

    document.getElementById("month").addEventListener("change", function () {

      console.log("Month changed to: " + this.value);

    });


    // ==========================================
    // Form Submit Event
    // ==========================================

    document.getElementById("signupForm").addEventListener("submit", function (e) {

      e.preventDefault();


      // Get form values

      const firstname =
        document.getElementById("firstname").value.trim();

      const day =
        document.getElementById("day").value;

      const month =
        document.getElementById("month").value;

      const year =
        document.getElementById("year").value;

      const username =
        document.getElementById("username").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const website =
        document.getElementById("website").value.trim();

      const password =
        document.getElementById("password").value;

      const repassword =
        document.getElementById("repassword").value;

      const terms =
        document.getElementById("terms").checked;


      // ==========================================
      // Firstname Validation
      // ==========================================

      if (!firstname) {

        alert("Firstname is required.");

        return;
      }


      // ==========================================
      // Birthday Validation
      // ==========================================

      if (!day || !month || !year) {

        alert("Please select a complete birthday.");

        return;
      }


      // ==========================================
      // Username Validation
      // ==========================================

      if (!username) {

        alert("Username is required.");

        return;
      }


      // ==========================================
      // Email Validation
      // ==========================================

      const emailRegex =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!emailRegex.test(email)) {

        alert("Please enter a valid email address.");

        return;
      }


      // ==========================================
      // Website Validation
      // ==========================================

      const urlRegex =
        /^(https?:\/\/)?([\w\d-]+\.)+[\w-]+(\/.*)?$/i;

      if (!urlRegex.test(website)) {

        alert("Please enter a valid website URL.");

        return;
      }


      // ==========================================
      // Password Validation
      // ==========================================

      if (!password) {

        alert("Password is required.");

        return;
      }


      // ==========================================
      // Password Match Validation
      // ==========================================

      if (password !== repassword) {

        alert("Passwords do not match.");

        return;
      }


      // ==========================================
      // Terms & Conditions Validation
      // ==========================================

      if (!terms) {

        alert("You must agree to the terms & conditions.");

        return;
      }


      // ==========================================
      // Success Message
      // ==========================================

      alert("Form submitted successfully!");

    });

  </script>

</body>
</html>
