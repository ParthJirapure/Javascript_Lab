<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ATM PIN Verification</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        }

        .atm-container {
            width: 400px;
            background: #ffffff;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .atm-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .atm-header h1 {
            color: #203a43;
            margin-bottom: 8px;
        }

        .atm-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2c5364;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #203a43;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #2c5364;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
        }

        .success {
            display: block;
            background: #e8f8ee;
            border: 1px solid #38a169;
            color: #155724;
        }

        .warning {
            display: block;
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
        }

        .transaction-info {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid currentColor;
        }

        .transaction-info p {
            margin: 7px 0;
        }

        .access {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .attempt {
            text-align: center;
            margin-top: 18px;
            color: #777;
            font-size: 14px;
        }

        .reset-btn {
            margin-top: 12px;
            background: #777;
        }

        .reset-btn:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <div class="atm-container">

        <div class="atm-header">
            <h1>🏦 ATM System</h1>
            <p>PIN Verification System</p>
        </div>

        <div class="form-group">
            <label for="accountHolder">Account Holder</label>
            <input
                type="text"
                id="accountHolder"
                placeholder="Enter your name"
            >
        </div>

        <div class="form-group">
            <label for="pin">Enter PIN</label>
            <input
                type="password"
                id="pin"
                placeholder="Enter any PIN"
                inputmode="numeric"
            >
        </div>

        <button onclick="verifyPin()">
            Verify PIN
        </button>

        <div id="result" class="result"></div>

        <p id="attemptDisplay" class="attempt">
            Transaction Attempts: 0
        </p>

        <button class="reset-btn" onclick="resetATM()">
            Reset
        </button>

    </div>


    <script>

        // ==========================================
        // 1. FUNCTION DECLARATION
        // ==========================================

        // Utility function to reverse the entered PIN
        function reversePin(pin) {
            const pinStr = String(pin);

            return pinStr
                .split('')
                .reverse()
                .join('');
        }


        // ==========================================
        // 2. CLOSURE & SCOPE DEMONSTRATION
        // ==========================================

        // ATM Session Generator
        function createATMSession(accountHolder) {

            // Outer lexical scope variable
            const user = accountHolder;

            // Private variable
            let attempts = 0;


            // ==========================================
            // 3. ARROW FUNCTION
            // Closure over `user` and `attempts`
            // ==========================================

            const verifyPinInteractive = (enteredPin) => {

                attempts++;


                // Remove extra spaces
                const strEnteredPin = String(enteredPin).trim();


                // Empty PIN
                if (!strEnteredPin) {
                    return {
                        cancelled: true,
                        attempts: attempts
                    };
                }


                // Reverse PIN
                const reversed = reversePin(strEnteredPin);


                // Check palindrome
                const isPalindrome =
                    strEnteredPin === reversed;


                return {
                    user: user,
                    enteredPin: strEnteredPin,
                    reversed: reversed,
                    isPalindrome: isPalindrome,
                    attempts: attempts
                };
            };


            // Return the inner function
            return verifyPinInteractive;
        }


        // ==========================================
        // 4. ATM SYSTEM
        // ==========================================

        let johnSession = null;


        function verifyPin() {

            const accountHolder =
                document.getElementById("accountHolder").value.trim();

            const pin =
                document.getElementById("pin").value.trim();

            const resultBox =
                document.getElementById("result");

            const attemptDisplay =
                document.getElementById("attemptDisplay");


            // Validate name
            if (!accountHolder) {

                resultBox.className = "result warning";

                resultBox.innerHTML = `
                    <strong>Please enter the account holder's name.</strong>
                `;

                return;
            }


            // Create ATM session only once
            if (!johnSession) {
                johnSession = createATMSession(accountHolder);
            }


            // Validate PIN
            if (!pin) {

                resultBox.className = "result warning";

                resultBox.innerHTML = `
                    <strong>Transaction cancelled.</strong>
                    <p>Please enter a PIN.</p>
                `;

                return;
            }


            // Call closure function
            const transaction =
                johnSession(pin);


            // Display attempt count
            attemptDisplay.innerText =
                `Transaction Attempts: ${transaction.attempts}`;


            // ==========================================
            // PALINDROME DETECTED
            // ==========================================

            if (transaction.isPalindrome) {

                resultBox.className = "result warning";

                resultBox.innerHTML = `

                    <div class="access">
                        ACCESS GRANTED!
                    </div>

                    <p>
                        Welcome, ${transaction.user}.
                    </p>

                    <div class="transaction-info">

                        <p>
                            <strong>Entered PIN:</strong>
                            ${transaction.enteredPin}
                        </p>

                        <p>
                            <strong>Reversed PIN:</strong>
                            ${transaction.reversed}
                        </p>

                        <p>
                            <strong>Palindrome:</strong>
                            Yes
                        </p>

                        <br>

                        <strong>
                            ⚠️ SPECIAL SECURITY ALERT
                        </strong>

                        <p>
                            Your PIN
                            "${transaction.enteredPin}"
                            is a palindrome.
                            Please consider changing your PIN
                            for better security.
                        </p>

                    </div>
                `;
            }


            // ==========================================
            // NORMAL PIN
            // ==========================================

            else {

                resultBox.className = "result success";

                resultBox.innerHTML = `

                    <div class="access">
                        ACCESS GRANTED!
                    </div>

                    <p>
                        Welcome, ${transaction.user}.
                    </p>

                    <div class="transaction-info">

                        <p>
                            <strong>Entered PIN:</strong>
                            ${transaction.enteredPin}
                        </p>

                        <p>
                            <strong>Reversed PIN:</strong>
                            ${transaction.reversed}
                        </p>

                        <p>
                            <strong>Palindrome:</strong>
                            No
                        </p>

                        <br>

                        <strong>
                            ✅ PIN accepted successfully.
                        </strong>

                    </div>
                `;
            }
        }


        // ==========================================
        // RESET ATM
        // ==========================================

        function resetATM() {

            johnSession = null;

            document.getElementById("accountHolder").value = "";
            document.getElementById("pin").value = "";

            const resultBox =
                document.getElementById("result");

            resultBox.className = "result";
            resultBox.innerHTML = "";

            document.getElementById("attemptDisplay")
                .innerText = "Transaction Attempts: 0";
        }

    </script>

</body>
</html>
