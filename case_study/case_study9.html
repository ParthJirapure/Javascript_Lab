```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List - Internal JavaScript</title>

    <style>

        /* =========================
           LIGHT THEME
        ========================== */

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            color: black;
            margin: 0;
            padding: 30px;
            transition: 0.3s;
        }


        /* =========================
           THEME BUTTON
        ========================== */

        #themeButton {
            position: fixed;
            top: 20px;
            left: 20px;

            width: auto;
            padding: 10px 18px;

            border: none;
            border-radius: 20px;

            background-color: #333;
            color: white;

            cursor: pointer;
            font-size: 14px;

            z-index: 1000;
        }

        #themeButton:hover {
            background-color: #555;
        }


        /* =========================
           STUDENT DETAILS
        ========================== */

        .student-details {
            position: absolute;
            top: 30px;
            right: 40px;

            width: 230px;

            background-color: white;

            padding: 20px;

            border-radius: 10px;

            box-shadow: 0 0 10px #aaa;

            transition: 0.3s;
        }


        .student-details h2 {
            margin-top: 0;
            text-align: center;
            color: #333;
        }


        .student-details p {
            margin: 10px 0;
            font-size: 15px;
        }


        /* =========================
           TODO LIST
        ========================== */

        .todo-container {
            width: 550px;

            margin: 100px auto 0 auto;

            background-color: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0 0 10px #aaa;

            transition: 0.3s;
        }


        .todo-container h1 {
            text-align: center;
            color: #333;
        }


        /* =========================
           INPUT AREA
        ========================== */

        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }


        #taskInput {
            flex: 1;

            padding: 12px;

            font-size: 16px;

            border: 1px solid #ccc;

            border-radius: 5px;

            box-sizing: border-box;
        }


        /* =========================
           BUTTONS
        ========================== */

        button {
            padding: 10px 15px;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-size: 14px;
        }


        /* Add Button */

        #addBtn {
            background-color: green;
            color: white;
        }


        #addBtn:hover {
            background-color: darkgreen;
        }


        /* =========================
           TASK LIST
        ========================== */

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }


        li {
            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 12px;

            margin-bottom: 10px;

            background-color: #eee;

            border-radius: 5px;
        }


        .task-text {
            flex: 1;
            cursor: pointer;
        }


        /* Completed Task */

        .completed {
            text-decoration: line-through;
            color: gray;
        }


        /* Complete Button */

        .complete-btn {
            background-color: #2e7d32;
            color: white;

            margin-right: 5px;

            font-size: 18px;

            padding: 7px 12px;
        }


        .complete-btn:hover {
            background-color: #1b5e20;
        }


        /* Edit Button */

        .edit-btn {
            background-color: orange;
            color: white;

            margin-right: 5px;
        }


        .edit-btn:hover {
            background-color: darkorange;
        }


        /* Delete Button */

        .delete-btn {
            background-color: red;
            color: white;
        }


        .delete-btn:hover {
            background-color: darkred;
        }


        /* =========================
           DARK MODE
        ========================== */

        body.dark-mode {
            background-color: #121212;
            color: white;
        }


        body.dark-mode .student-details {
            background-color: #1e1e1e;
            color: white;

            box-shadow: 0 0 10px #555;
        }


        body.dark-mode .student-details h2 {
            color: white;
        }


        body.dark-mode .todo-container {
            background-color: #1e1e1e;
            color: white;

            box-shadow: 0 0 10px #555;
        }


        body.dark-mode .todo-container h1 {
            color: white;
        }


        body.dark-mode #taskInput {
            background-color: #333;
            color: white;

            border-color: #666;
        }


        body.dark-mode #taskInput::placeholder {
            color: #ccc;
        }


        body.dark-mode li {
            background-color: #333;
            color: white;
        }


        /* =========================
           RESPONSIVE DESIGN
        ========================== */

        @media (max-width: 800px) {

            #themeButton {
                position: static;

                display: block;

                margin-bottom: 20px;
            }


            .student-details {
                position: static;

                width: auto;

                margin-bottom: 30px;
            }


            .todo-container {
                width: auto;

                margin: 20px auto;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         LIGHT / DARK MODE BUTTON
    ========================== -->

    <button id="themeButton" onclick="toggleTheme()">
        🌙 Dark Mode
    </button>


    <!-- =========================
         STUDENT DETAILS
    ========================== -->

    <div class="student-details">

        <h2>Student Details</h2>

        <p>
            <b>Name :</b> Parth Jirapure
        </p>

        <p>
            <b>PRN :</b> 24070521243
        </p>

        <p>
            <b>Semester :</b> 5th
        </p>

        <p>
            <b>Section :</b> D
        </p>

    </div>


    <!-- =========================
         TODO LIST
    ========================== -->

    <div class="todo-container">

        <h1>To-Do List</h1>

        <div class="input-area">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task"
            >

            <button id="addBtn">
                Add
            </button>

        </div>

        <ul id="taskList"></ul>

    </div>


    <script>

        /* =========================
           LIGHT / DARK THEME
        ========================== */

        function toggleTheme() {

            document.body.classList.toggle("dark-mode");

            let button =
                document.getElementById("themeButton");


            if (
                document.body.classList.contains("dark-mode")
            ) {

                button.innerHTML = "☀️ Light Mode";

            } else {

                button.innerHTML = "🌙 Dark Mode";

            }

        }


        /* =========================
           DOM TRAVERSAL
        ========================== */

        const taskInput =
            document.getElementById("taskInput");

        const addBtn =
            document.getElementById("addBtn");

        const taskList =
            document.getElementById("taskList");


        /* =========================
           ADD BUTTON EVENT
        ========================== */

        addBtn.addEventListener(
            "click",
            addTask
        );


        /* =========================
           ENTER KEY EVENT
        ========================== */

        taskInput.addEventListener(
            "keypress",
            function(event) {

                if (event.key === "Enter") {

                    addTask();

                }

            }
        );


        /* =========================
           ADD TASK FUNCTION
        ========================== */

        function addTask() {

            const task =
                taskInput.value.trim();


            if (task === "") {

                alert("Please enter a task.");

                return;

            }


            /* CREATE LIST ITEM */

            const li =
                document.createElement("li");


            /* CREATE TASK TEXT */

            const span =
                document.createElement("span");

            span.className = "task-text";

            span.textContent = task;


            /* COMPLETE TASK */

            span.addEventListener(
                "click",
                function() {

                    span.classList.toggle(
                        "completed"
                    );

                }
            );


            /* COMPLETE BUTTON */

            const completeBtn =
                document.createElement("button");

            completeBtn.textContent = "✓";

            completeBtn.className =
                "complete-btn";


            completeBtn.addEventListener(
                "click",
                function() {

                    span.classList.toggle(
                        "completed"
                    );

                }
            );


            /* EDIT BUTTON */

            const editBtn =
                document.createElement("button");

            editBtn.textContent = "Edit";

            editBtn.className =
                "edit-btn";


            editBtn.addEventListener(
                "click",
                function() {

                    const taskText =
                        li.querySelector(
                            ".task-text"
                        );


                    const newTask =
                        prompt(
                            "Edit your task:",
                            taskText.textContent
                        );


                    if (
                        newTask !== null &&
                        newTask.trim() !== ""
                    ) {

                        taskText.textContent =
                            newTask.trim();

                    }

                }
            );


            /* DELETE BUTTON */

            const deleteBtn =
                document.createElement("button");

            deleteBtn.textContent = "Delete";

            deleteBtn.className =
                "delete-btn";


            deleteBtn.addEventListener(
                "click",
                function() {

                    taskList.removeChild(li);

                }
            );


            /* BUTTON CONTAINER */

            const buttons =
                document.createElement("div");


            buttons.appendChild(completeBtn);

            buttons.appendChild(editBtn);

            buttons.appendChild(deleteBtn);


            /* ADD ELEMENTS */

            li.appendChild(span);

            li.appendChild(buttons);


            /* ADD LI TO LIST */

            taskList.appendChild(li);


            /* CLEAR INPUT */

            taskInput.value = "";

            taskInput.focus();

        }

    </script>


</body>

</html>
```
